<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eliciter</title>
<!-- A fountain-pen nib, inline so the page stays self-contained and makes no
     extra request. One path with fill-rule=evenodd, so the breather hole and the
     slit are genuinely transparent and the shape survives a light or dark tab bar.
     Amber rather than the UI's blue: indexia's tab has no icon and blue is what
     every other tab already is. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20fill%3D%22%23d4872a%22%20fill-rule%3D%22evenodd%22%20d%3D%22M4%203L28%203L28%2012.5L16%2030L4%2012.5ZM16%206.4a3.1%203.1%200%20100%206.2a3.1%203.1%200%20100%20-6.2zM14.7%2012.9L17.3%2012.9L16%2027z%22%2F%3E%3C%2Fsvg%3E">
<style>
  :root {
    --bg:#faf9f7; --panel:#fff; --ink:#1a1a1a; --dim:#6b6660; --line:#e3ded7;
    --accent:#3b5f8a; --ok:#2f6b3f; --no:#8a3b3b; --chip:#f0ece6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --panel:#1e2126; --ink:#e8e6e3; --dim:#9a948c; --line:#2f343b;
            --accent:#8fb3dd; --ok:#7fc08f; --no:#dd9090; --chip:#272b31; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 ui-sans-serif,
         -apple-system,"Segoe UI",Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg);
           border-bottom:1px solid var(--line); padding:.7rem 1rem; }
  .bar { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; max-width:1100px; margin:0 auto; }
  h1 { font-size:1rem; margin:0 1rem 0 0; letter-spacing:.02em; font-weight:600; }
  main { max-width:1100px; margin:0 auto; padding:1rem; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel);
           color:var(--ink); border-radius:6px; padding:.35rem .7rem; }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.5; cursor:progress; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover:not(:disabled) { color:#fff; filter:brightness(1.1); }
  input[type=search] { font:inherit; padding:.35rem .6rem; border:1px solid var(--line);
                       border-radius:6px; background:var(--panel); color:var(--ink); min-width:15rem; }
  nav { display:flex; gap:.3rem; border-bottom:1px solid var(--line); margin-bottom:1rem; }
  nav button { border:0; border-bottom:2px solid transparent; border-radius:0; background:none; }
  nav button[aria-selected=true] { border-bottom-color:var(--accent); color:var(--accent); font-weight:600; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px;
          padding:.8rem 1rem; margin-bottom:.7rem; }
  .card h3 { margin:.1rem 0 .35rem; font-size:1rem; line-height:1.4; }
  .meta { color:var(--dim); font-size:.82rem; display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
  .chip { background:var(--chip); border-radius:99px; padding:.05rem .5rem; font-size:.75rem;
          font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .abs { color:var(--dim); font-size:.88rem; margin:.45rem 0 0;
         display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .abs.open { -webkit-line-clamp:unset; }
  .actions { display:flex; gap:.4rem; margin-top:.6rem; flex-wrap:wrap; }
  .actions button { font-size:.83rem; padding:.25rem .6rem; }
  .ok { color:var(--ok); } .no { color:var(--no); }
  .empty { color:var(--dim); padding:2rem 1rem; text-align:center; }
  #toast { position:fixed; bottom:1rem; left:50%; transform:translateX(-50%);
           background:var(--ink); color:var(--bg); padding:.5rem .9rem; border-radius:6px;
           font-size:.87rem; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20; }
  #toast.show { opacity:1; }
  dialog { border:1px solid var(--line); border-radius:10px; background:var(--panel);
           color:var(--ink); max-width:min(760px,92vw); padding:0; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .dlg-head { display:flex; justify-content:space-between; align-items:center;
              padding:.7rem 1rem; border-bottom:1px solid var(--line); }
  pre { margin:0; padding:1rem; overflow:auto; max-height:55vh; font-size:.83rem;
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; }
  .cmd { background:var(--chip); padding:.5rem .7rem; margin:0 1rem 1rem; border-radius:6px;
         font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.85rem;
         display:flex; justify-content:space-between; gap:.5rem; align-items:center; }
  .status-line { color:var(--dim); font-size:.82rem; margin-left:auto; }
  details summary { cursor:pointer; color:var(--dim); font-size:.85rem; }

  /* --- source material, shown in place -------------------------------------
     The material behind a prompt used to be a <details> full of a <pre>, which
     is where a poem goes to look like a stack trace. These three rules are the
     difference between quoting a source and displaying it: a left rule that
     says "this is not the tool talking", the source's own line breaks kept, and
     a reading measure rather than the full width of the card. */
  .material { border-left:2px solid var(--line); padding:.15rem 0 .15rem .8rem;
              margin:.5rem 0 .2rem; }
  .material .body { white-space:pre-wrap; font-size:.87rem; line-height:1.6;
                    max-width:64ch; color:var(--ink); margin:0; }
  .material .body.clip { max-height:9.5rem; overflow:hidden;
                         -webkit-mask-image:linear-gradient(#000 65%,transparent);
                         mask-image:linear-gradient(#000 65%,transparent); }
  .material .where { color:var(--dim); font-size:.75rem; margin-top:.45rem;
                     font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
                     word-break:break-all; }
  .srcline { display:flex; gap:.4rem; align-items:baseline; flex-wrap:wrap;
             font-size:.82rem; color:var(--dim); margin:.3rem 0; }
  /* A link that opens material, not a page. Underline on hover only, so a card
     with four of them does not read as a link farm. */
  .open { background:none; border:0; padding:0; font:inherit; font-size:.82rem;
          color:var(--accent); cursor:pointer; text-align:left; }
  .open:hover { text-decoration:underline; }
  .conn { border-left:2px solid var(--chip); padding-left:.7rem; margin:.35rem 0; }
  .conn .terms { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.76rem; }
  .members { list-style:none; padding:0; margin:.4rem 0 0; }
  .members li { border-left:2px solid var(--line); padding:.1rem 0 .1rem .7rem;
                margin-bottom:.5rem; }
  .members .ex { color:var(--dim); font-size:.82rem; display:block; margin-top:.1rem; }
  .src-tag { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em;
             color:var(--dim); }
  .cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(19rem,1fr)); gap:.7rem; }
  .cols h2 { font-size:.85rem; text-transform:uppercase; letter-spacing:.07em;
             color:var(--dim); margin:.2rem 0 .5rem; font-weight:600; }
  .row { border-bottom:1px solid var(--line); padding:.45rem 0; }
  .row:last-child { border-bottom:0; }
  .row .t { font-weight:500; }
  .row .p { color:var(--dim); font-size:.82rem; margin-top:.1rem; }
  .where-line { color:var(--dim); font-size:.78rem; padding:0 1rem .8rem;
               font-family:ui-monospace,SFMono-Regular,Menlo,monospace; word-break:break-all; }
  .reader { white-space:pre-wrap; font-size:.88rem; line-height:1.62; padding:1rem;
            max-height:60vh; overflow:auto; max-width:72ch; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>eliciter</h1>
    <input type="search" id="q" placeholder="search arxiv — words, or ti:/au:/cat:">
    <button id="go">Search</button>
    <span class="status-line" id="status"></span>
  </div>
</header>
<main>
  <nav id="tabs">
    <button data-tab="prompts" aria-selected="true">Prompts</button>
    <button data-tab="papers" aria-selected="false">Queue</button>
    <button data-tab="decided" aria-selected="false">Decided</button>
    <button data-tab="sources" aria-selected="false">Sources</button>
    <button data-tab="search" aria-selected="false">Search</button>
  </nav>
  <section id="view"></section>
</main>
<div id="toast"></div>
<dialog id="dlg">
  <div class="dlg-head"><strong id="dlg-title">Brief</strong>
    <button onclick="document.getElementById('dlg').close()">Close</button></div>
  <div class="cmd"><span id="dlg-cmd"></span><button id="dlg-copy">Copy</button></div>
  <pre id="dlg-body"></pre>
</dialog>
<!-- The reader. A second dialog rather than a mode on the first one: the brief is
     something you copy into a terminal and the material is something you read, and
     one dialog doing both would have to hide half its own chrome each time. -->
<dialog id="rdr">
  <div class="dlg-head">
    <div><strong id="rdr-title">Source</strong>
      <div class="src-tag" id="rdr-sub"></div></div>
    <div style="display:flex;gap:.4rem">
      <button id="rdr-copy">Copy text</button>
      <button onclick="document.getElementById('rdr').close()">Close</button>
    </div>
  </div>
  <div class="where-line" id="rdr-where"></div>
  <div class="reader" id="rdr-body"></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
let S = { papers:{unread:[],read:[],rejected:[],cap:10}, prompts:[], config:{} };
let searchResults = [], tab = "prompts", busy = false;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function toast(msg, ms=2600) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms);
}
function setBusy(on, what) {
  busy = on;
  document.querySelectorAll("header button").forEach(b => b.disabled = on);
  $("#status").textContent = on ? (what || "working…") : "";
}
async function api(path, opts={}) {
  const r = await fetch(path, {
    ...opts,
    headers: { "Content-Type":"application/json", "X-Eliciter":"1", ...(opts.headers||{}) },
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

async function refresh() { S = await api("/api/state"); paint(); }

function paperCard(p, opts={}) {
  const authors = (p.authors||[]).slice(0,3).join(", ") + ((p.authors||[]).length>3 ? " et al." : "");
  const matched = (p.matched||[]).slice(0,6).map(m => `<span class="chip">${esc(m)}</span>`).join(" ");
  const score = p.score ? `<span class="chip">${Number(p.score).toFixed(2)}</span>` : "";
  let actions = "";
  if (opts.queue) actions = `
    <button onclick="mark('${esc(p.id)}','read')">✓ Read</button>
    <button onclick="mark('${esc(p.id)}','rejected')">✗ Reject</button>`;
  else if (opts.decided) actions = `<button onclick="mark('${esc(p.id)}','unread')">↺ Back to queue</button>`;
  else if (opts.search) actions = p.in_queue
    ? `<button disabled>Already queued</button>`
    : `<button onclick="addPaper('${esc(p.id)}')">+ Add to queue</button>`;
  return `<article class="card">
    <h3>${esc(p.title)}</h3>
    <div class="meta">${score}<span class="chip">${esc(p.id)}</span>
      <span>${esc(p.primary_category||"")}</span><span>${esc(authors)}</span>
      ${p.status==="read" ? '<span class="ok">✓ read</span>' : ""}
      ${p.status==="rejected" ? '<span class="no">✗ rejected</span>' : ""}
    </div>
    ${matched ? `<div class="meta" style="margin-top:.3rem">matched ${matched}</div>` : ""}
    <p class="abs" onclick="this.classList.toggle('open')">${esc(p.abstract)}</p>
    <div class="actions">${actions}
      <button onclick="window.open('${esc(p.url)}','_blank','noopener')">arxiv ↗</button>
    </div></article>`;
}

// --- source material, opened in place -------------------------------------
//
// Three ways to reach the same material, because there are three moments where you
// want it. `materialBlock` is the excerpt the prompt already carries, rendered as
// prose instead of as a <pre> and clipped rather than hidden behind a disclosure
// triangle — the old <details> meant the commonest question about a prompt ("what
// is this about?") cost a click every single time. `openSource` fetches the whole
// thing into the reader. `sourceLink` is the button that does it, and it is the
// same button whether it sits on a prompt, on a connection, or on a confluence
// member, so anything the page names you can also read.

function sourceLink(source, ref, label) {
  if (!source || !ref) return "";
  return `<button class="open" onclick="openSource('${esc(source)}','${esc(ref)}')"
           title="open ${esc(source)} · ${esc(ref)}">${esc(label || "read it")} →</button>`;
}

function materialBlock(p) {
  if (!p.material) return "";
  const long = p.material.length > 420 || p.material.split("\n").length > 7;
  return `<div class="material">
    <p class="body${long ? " clip" : ""}">${esc(p.material)}</p>
    ${long ? `<button class="open" onclick="
        this.previousElementSibling.classList.toggle('clip');
        this.textContent = this.previousElementSibling.classList.contains('clip')
          ? 'show the rest \u2193' : 'show less \u2191';">show the rest \u2193</button>` : ""}
  </div>`;
}

// A prompt's provenance, and the whole reason the card is worth looking at. Every entry is
// something a session actually read and cited, so every entry opens. One source or five is
// the same markup — a cross-source prompt is just a prompt with more of these, which is
// what replaced the old confluence special case.
function sourceBlock(p) {
  const items = p.sources || [];
  if (!items.length) return "";
  return `<ul class="members">` + items.map(sr => `
    <li><span class="src-tag">${esc(sr.source)}</span>
      ${esc(sr.title || sr.ref)} ${sourceLink(sr.source, sr.ref, "read it")}
      ${sr.why ? `<span class="ex">${esc(sr.why)}</span>` : ""}
    </li>`).join("") + `</ul>`;
}

function promptCard(p) {
  const sources = p.sources || [];
  // The chip says where a prompt came from. Several sources is the interesting case, so it
  // is named as such rather than listed — the openable list below says which.
  const origin = sources.length > 1
    ? `${sources.length} sources`
    : (sources[0] ? sources[0].source : "");
  return `<article class="card">
    <h3>${p.n}. ${esc(p.title)}</h3>
    <div class="meta">
      <span class="chip">${esc(p.length)} form</span>
      <span class="chip">${esc(p.register)} · ${esc(p.form)}</span>
      ${origin ? `<span class="chip">${esc(origin)}</span>` : ""}
      <span>→ ${esc(p.project)}</span>
    </div>
    <p style="margin:.5rem 0 .2rem"><strong>${esc(p.ask)}</strong></p>
    ${p.because ? `<p class="abs open" style="margin-top:.2rem">${esc(p.because)}</p>` : ""}
    ${sourceBlock(p)}
    ${materialBlock(p)}
    ${p.commit ? `<p class="meta" style="margin-top:.5rem">→ ${esc(p.commit)}</p>` : ""}
    <div class="actions">
      <button onclick="showBrief(${p.n})">Write this →</button>
    </div>
  </article>`;
}

async function openSource(source, ref) {
  try {
    const d = await api(`/api/source?source=${encodeURIComponent(source)}&ref=${encodeURIComponent(ref)}`);
    $("#rdr-title").textContent = d.title || ref;
    $("#rdr-sub").textContent = d.subtitle || source;
    $("#rdr-where").textContent = d.where || "";
    $("#rdr-body").textContent = d.body || "(no text)";
    $("#rdr-body").scrollTop = 0;
    $("#rdr-copy").onclick = async () => {
      await navigator.clipboard.writeText(d.body || "");
      toast("copied");
    };
    $("#rdr").showModal();
  } catch (e) { toast(e.message, 4000); }
}

// The catalogue behind the Sources tab. Fetched on demand rather than folded into
// /api/state, which polls: reading every post and transcript off disk three times a
// minute to keep a tab warm that may never be opened is the wrong trade.
let sources = null;
async function loadSources(force) {
  if (sources && !force) return sources;
  sources = await api("/api/sources");
  return sources;
}

function sourceRows(items, source, extra) {
  if (!items.length) return `<p class="meta">nothing here</p>`;
  return items.map(it => `<div class="row">
    <div class="t">${sourceLink(source, it.ref, it.title || it.ref)}</div>
    <div class="p">${esc(it.date || "")}${extra ? " · " + extra(it) : ""}</div>
    ${it.preview ? `<div class="p">${esc(it.preview)}</div>` : ""}
  </div>`).join("");
}

function sourcesView() {
  if (!sources) return `<div class="empty">Reading your sources…</div>`;
  const S_ = sources, err = S_.errors || {};
  const col = (name, title, body) => `<section class="card"><h2>${title}</h2>
    ${err[name] ? `<p class="meta no">unavailable — ${esc(err[name])}</p>` : ""}
    ${body}</section>`;
  return `<div class="cols">
    ${col("notes", "indexia — recent notes", sourceRows(S_.notes || [], "indexia",
        it => esc(it.source_ref || "")))}
    ${col("posts", "perceptua — posts", sourceRows(S_.posts || [], "perceptua",
        it => (it.categories || []).join(", ")))}
    ${col("sessions", "audua — recordings", sourceRows(S_.sessions || [], "audua",
        it => (it.threads ? "threads left open" : "") +
              (it.seen ? (it.threads ? " · " : "") + "already offered" : "")))}
    ${col("papers", "arxiv — the queue", sourceRows(S_.papers || [], "arxiv",
        it => esc(it.status || "")))}
  </div>`;
}

function paint() {
  const v = $("#view");
  if (tab === "prompts") {
    v.innerHTML = S.prompts.length
      ? S.prompts.map(promptCard).join("")
      // Prompts are written by a Claude session that has read state/material.json, so the
      // empty state is instructions rather than a button — the page cannot start a session
      // any more than it can start the writing one. Both hand over a command instead.
      : `<div class="empty">No prompts yet.<br><br>
           <code>bash scripts/gather.sh</code> reads your sources (cron does this each
           morning),<br>then open a session in <code>~/eliciter</code> and ask for prompts.
           <br><br>They appear here as soon as the session renders them.</div>`;
  } else if (tab === "papers") {
    const u = S.papers.unread;
    v.innerHTML = (u.length
      ? `<p class="meta" style="margin:0 0 .7rem">${u.length} waiting · cap ${S.papers.cap}</p>`
        + u.map(p => paperCard(p, {queue:true})).join("")
      // Which papers are worth queuing is a session's judgement now, over the whole week
      // rather than the top ten by term overlap — so this is instructions, like the
      // prompts tab. Search still adds by hand: asking for a paper by name is a decision.
      : `<div class="empty">Queue is empty.<br><br>
           <code>bash scripts/sweep.sh fetch</code> pulls the week, then ask a session
           to pick — <br>or find a specific paper in <strong>Search</strong> and add it.</div>`);
  } else if (tab === "decided") {
    const d = [...S.papers.read, ...S.papers.rejected];
    v.innerHTML = d.length
      ? d.map(p => paperCard(p, {decided:true})).join("")
      : `<div class="empty">Nothing decided yet.</div>`;
  } else if (tab === "sources") {
    v.innerHTML = sourcesView();
  } else {
    v.innerHTML = searchResults.length
      ? searchResults.map(p => paperCard(p, {search:true})).join("")
      : `<div class="empty">Search arxiv from the bar above. Rejected papers can be
         re-added here — searching ignores the interest filter.</div>`;
  }
}

function show(name) {
  tab = name;
  document.querySelectorAll("#tabs button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.tab === name)));
  paint();
  // Painted first, then filled: the catalogue is a disk read of every post and every
  // transcript, and blocking the tab switch on it would make Sources feel broken on the
  // first click even though it is working.
  if (name === "sources") {
    loadSources().then(() => { if (tab === "sources") paint(); })
                 .catch(e => toast(e.message, 4000));
  }
}

async function mark(id, status) {
  try { S = await api("/api/status", {method:"POST", body:JSON.stringify({id, status})});
        paint(); toast(`marked ${status}`); }
  catch (e) { toast(e.message); }
}
async function addPaper(id) {
  const paper = searchResults.find(p => p.id === id);
  try { await api("/api/add", {method:"POST", body:JSON.stringify({paper})});
        paper.in_queue = true; await refresh(); paint(); toast("added to queue"); }
  catch (e) { toast(e.message); }
}
async function showBrief(n) {
  try {
    const b = await api(`/api/brief?n=${n}`);
    $("#dlg-title").textContent = `Prompt ${n} → ${b.project}`;
    $("#dlg-cmd").textContent = `cd ${b.cwd} && ${b.command}`;
    $("#dlg-body").textContent = b.brief;
    $("#dlg-copy").onclick = async () => {
      await navigator.clipboard.writeText($("#dlg-cmd").textContent);
      toast("command copied — paste it in a terminal");
    };
    $("#dlg").showModal();
  } catch (e) { toast(e.message); }
}

$("#tabs").onclick = e => { if (e.target.dataset.tab) show(e.target.dataset.tab); };
async function doSearch() {
  const q = $("#q").value.trim();
  if (!q) return;
  setBusy(true, "searching arxiv…");
  try { const r = await api(`/api/search?q=${encodeURIComponent(q)}`);
        searchResults = r.results; show("search");
        toast(`${r.results.length} result(s)`); }
  catch (e) { toast(e.message, 5000); } finally { setBusy(false); }
}
$("#go").onclick = doSearch;
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });

// The server is now backgroundable (scripts/ui.sh start), so a tab can outlive the CLI
// invocation that changed the queue. Every /api/state read is already fresh off disk
// (see webui.state_payload) — this just makes sure an open tab actually asks again:
// on an interval while visible, and immediately on getting focus back.
let pollTimer = null;
function schedulePoll() {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    if (!busy && !document.hidden) { try { await refresh(); } catch (e) { /* transient */ } }
    schedulePoll();
  }, 20000);
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !busy) refresh().catch(() => {});
});
window.addEventListener("focus", () => { if (!busy) refresh().catch(() => {}); });

refresh().catch(e => toast(e.message, 6000));
schedulePoll();
</script>
</body>
</html>
